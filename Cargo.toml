[package]
name = "shard-router"
version = "0.1.0"
edition = "2021"
description = "Deterministic-first shard router for the Kalshi exchange: verified shard resolution, exact integer fee schedules, async-safe prefunding, ledger reconciliation, and VOPR-style simulation testing."
license = "MIT"
repository = "https://github.com/copyleftdev/shard-router"
homepage = "https://github.com/copyleftdev/shard-router"
documentation = "https://github.com/copyleftdev/shard-router#readme"
readme = "README.md"
keywords = ["kalshi", "trading", "prediction-markets", "cli", "fintech"]
categories = ["command-line-utilities", "finance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
base64 = "0.22"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
